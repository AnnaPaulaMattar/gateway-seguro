
spring.application.name=gateway-seguro

server.port=8443

server.ssl.enabled=true
server.ssl.key-store=${user.home}/https-seguranca/gateway-https.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${GATEWAY_SSL_PASSWORD}
server.ssl.key-alias=gateway-https

app.jwt.issuer=http://localhost:9000
app.pedidos.url=http://localhost:8081

# Rate Limiting
app.rate-limit.ip.max-requests=30
app.rate-limit.user.max-requests=20
app.rate-limit.window-seconds=60

logging.level.br.com.gatewayseguro.ratelimit=DEBUG

gateway.internal.secret=${GATEWAY_INTERNAL_SECRET}
